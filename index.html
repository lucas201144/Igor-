<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igor Auto Elétrica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--blue:#0b3d91;--yellow:#ffc400;--bg:#f6f8fc;--card:#fff;--text:#12203a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#162038;--text:#eef2fb}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 5%;border-bottom:4px solid var(--yellow)}
header img{height:42px;max-width:120px;object-fit:contain;display:none}
header b{font-size:1.15rem;flex:1}
header a{color:#fff;text-decoration:none;font-weight:600;font-size:.9rem}
.ig{display:none;align-items:center;gap:6px;background:var(--yellow);color:#111!important;padding:6px 12px;border-radius:999px}
.hero{background:linear-gradient(135deg,var(--blue),#1d63d6) center/cover;color:#fff;text-align:center;padding:80px 6%;position:relative}
.hero.has{padding:110px 6%;text-shadow:0 2px 10px #000a}
.hero.has::before{content:"";position:absolute;inset:0;background:#0007}
.hero>*{position:relative}
.hero h1{margin:0 0 10px;font-size:clamp(1.8rem,6vw,3.2rem)}
.hero p{margin:0 auto 24px;max-width:560px;opacity:.95;white-space:pre-line}
.btn{display:inline-block;background:var(--yellow);color:#111;font-weight:700;padding:13px 26px;border-radius:999px;text-decoration:none;border:0;font-size:1rem;cursor:pointer;text-shadow:none}
section{padding:48px 5%;max-width:1000px;margin:auto}
h2{color:var(--blue);margin:0 0 20px;border-left:6px solid var(--yellow);padding-left:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--yellow)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);padding:20px;border-radius:14px;box-shadow:0 2px 10px #0002;border-top:4px solid var(--yellow)}
#pano{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#0003;touch-action:none;cursor:grab}
#panoBox{display:none}
footer{background:var(--blue);color:#fff;text-align:center;padding:24px 5%;white-space:pre-line}
footer a{color:#fff}
#panel{display:none;position:fixed;inset:0;z-index:20;background:#000a;overflow:auto;padding:5%}
#panel>div{background:var(--card);max-width:480px;margin:auto;padding:22px;border-radius:14px}
#panel label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}
#panel input[type=text],#panel textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--text);font:inherit}
#panel input[type=color]{width:60px;height:38px;border:0;background:none}
#panel h4{margin:22px 0 0;color:var(--blue)}
.row{display:flex;gap:20px}
#msg{font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<header><img id="logo" alt="Logo"><b id="nm"></b><a class="ig" id="igTop" target="_blank" rel="noopener">Instagram</a><a href="#tour" id="tourLink">Visita 360°</a></header>
<div class="hero" id="hero"><h1 id="hTitle"></h1><p id="hText"></p><a class="btn" id="wa" href="#contato"></a></div>
<section><h2>Serviços</h2><div class="grid" id="svc"></div></section>
<section id="tour"><h2>Conheça a oficina em 360°</h2><div id="panoBox"><div id="pano"></div><p style="font-size:.85rem;opacity:.7">Arraste para olhar ao redor.</p></div><p id="noPano">Em breve.</p></section>
<footer id="contato"><b id="nm3"></b><br><span id="fText"></span><br><a id="igFoot" target="_blank" rel="noopener" style="display:none"></a><br><a href="#" id="lg" style="opacity:.7;font-size:.85rem">Área restrita</a></footer>

<div id="login" style="display:none;position:fixed;inset:0;z-index:30;background:#000a;align-items:center;justify-content:center;padding:5%"><div style="background:var(--card);padding:24px;border-radius:14px;width:100%;max-width:320px;text-align:center"><h3 style="margin-top:0">Login</h3><input type="password" id="pw" inputmode="numeric" placeholder="Senha" style="width:100%;padding:12px;border-radius:8px;border:1px solid #8886;background:var(--bg);color:var(--text);font-size:1rem"><div id="lgMsg" style="color:#d33;font-size:.9rem;min-height:1.4em;margin-top:6px"></div><p style="display:flex;gap:10px;justify-content:center;margin:8px 0 0"><button class="btn" id="lgGo">Entrar</button><button class="btn" id="lgX" style="background:#8884;color:inherit">Cancelar</button></p></div></div>

<div id="panel"><div>
<h3 style="margin-top:0">Painel do site</h3>
<h4>Topo</h4>
<label>Nome da oficina</label><input type="text" id="fName">
<label>Logo</label><input type="file" id="fLogo" accept="image/*">
<h4>Banner</h4>
<label>Imagem do banner (fundo)</label><input type="file" id="fBanner" accept="image/*">
<label><input type="checkbox" id="fNoBanner"> Remover banner</label>
<label>Título do banner</label><input type="text" id="fHTitle">
<label>Texto do banner</label><textarea id="fHText" rows="3"></textarea>
<label>Texto do botão</label><input type="text" id="fBtn">
<label>Link do botão (vazio = WhatsApp)</label><input type="text" id="fBtnLink" placeholder="https://...">
<h4>Serviços</h4>
<label>Um por linha, no formato: Título | Descrição</label><textarea id="fSvc" rows="6"></textarea>
<h4>Contato e redes</h4>
<label>WhatsApp (números com DDD)</label><input type="text" id="fPhone" placeholder="5584999999999">
<label>Instagram (@usuário)</label><input type="text" id="fInsta" placeholder="@minhaoficina">
<label>Texto do rodapé</label><textarea id="fFoot" rows="2"></textarea>
<h4>Visual</h4>
<div class="row"><div><label>Cor azul</label><input type="color" id="fBlue"></div><div><label>Cor amarela</label><input type="color" id="fYellow"></div></div>
<label>Foto 360° (equiretangular)</label><input type="file" id="fPano" accept="image/*">
<p style="display:flex;gap:10px;margin-top:20px"><button class="btn" id="save">Salvar</button><button class="btn" id="close" style="background:#8884;color:inherit">Fechar</button></p>
<div id="msg"></div></div></div>

<script type="application/json" id="cfg">{"name":"Minha Oficina","blue":"#0a101e","yellow":"#ffc400","phone":"5584981535031","logo":"","pano":"/_blob/34d334fc6e85b7d54c39eee94d1f1a3e","banner":"","heroTitle":"","heroText":"Cuidamos do seu carro com qualidade, rapidez e preço justo.","btn":"Fale conosco","btnLink":"","insta":"","footer":"Entre em contato e agende seu horário.","services":"Mecânica geral | Diagnóstico e reparos.\nRevisão | Óleo, filtros e freios.\nSuspensão | Alinhamento e balanceamento.\nElétrica | Bateria, alternador e injeção."}</script>
<script>
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
let cfg;try{cfg=JSON.parse($('cfg').textContent)}catch(e){cfg={}}
let viewer=null;
function apply(){
  const r=document.documentElement.style;
  r.setProperty('--blue',cfg.blue);r.setProperty('--yellow',cfg.yellow);
  ['nm','nm3'].forEach(i=>$(i).textContent=cfg.name);
  $('hTitle').textContent=cfg.heroTitle||cfg.name;
  $('hText').textContent=cfg.heroText||'';
  $('fText').textContent=cfg.footer||'';
  document.title=cfg.name;
  const l=$('logo');if(cfg.logo){l.src=cfg.logo;l.style.display='block'}else l.style.display='none';
  const h=$('hero');
  if(cfg.banner){h.style.backgroundImage='url("'+cfg.banner+'")';h.classList.add('has')}else{h.style.backgroundImage='';h.classList.remove('has')}
  const b=$('wa');b.textContent=cfg.btn||'Fale conosco';
  b.href=cfg.btnLink||(cfg.phone?'https://wa.me/'+cfg.phone:'#contato');
  if(cfg.btnLink||cfg.phone){b.target='_blank';b.rel='noopener'}
  const u=(cfg.insta||'').replace(/^@/,'').trim();
  ['igTop','igFoot'].forEach(i=>{const a=$(i);if(u){a.href='https://instagram.com/'+encodeURIComponent(u);a.style.display=i==='igTop'?'inline-flex':'inline';a.textContent=i==='igTop'?'Instagram':'Instagram @'+u}else a.style.display='none'});
  const g=$('svc');g.innerHTML='';
  (cfg.services||'').split('\n').filter(x=>x.trim()).forEach(line=>{
    const [t,...d]=line.split('|');const c=document.createElement('div');c.className='card';
    const bb=document.createElement('b');bb.textContent=t.trim();c.appendChild(bb);
    if(d.length){c.appendChild(document.createElement('br'));c.appendChild(document.createTextNode(d.join('|').trim()))}
    g.appendChild(c)});
  if(cfg.pano){$('panoBox').style.display='block';$('noPano').style.display='none';initPano(cfg.pano)}
  else{$('panoBox').style.display='none';$('noPano').style.display='block';$('tourLink').style.display='none'}
}
function initPano(url){
  if(!window.THREE||viewer===url)return;viewer=url;
  const el=$('pano');el.innerHTML='';
  const w=()=>el.clientWidth,h=()=>el.clientHeight;
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,w()/h(),1,1100);
  const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.setSize(w(),h());el.appendChild(rd.domElement);
  const g=new THREE.SphereGeometry(500,60,40);g.scale(-1,1,1);
  new THREE.TextureLoader().load(url,t=>{sc.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t})))});
  let lon=0,lat=0,down=false,sx=0,sy=0,auto=true;
  el.addEventListener('pointerdown',e=>{down=true;auto=false;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointerup',()=>down=false);
  el.addEventListener('pointermove',e=>{if(!down)return;lon-=(e.clientX-sx)*.2;lat=Math.max(-85,Math.min(85,lat+(e.clientY-sy)*.2));sx=e.clientX;sy=e.clientY});
  addEventListener('resize',()=>{cam.aspect=w()/h();cam.updateProjectionMatrix();rd.setSize(w(),h())});
  (function loop(){requestAnimationFrame(loop);if(auto)lon+=.08;
    const p=THREE.MathUtils.degToRad(90-lat),t=THREE.MathUtils.degToRad(lon);
    cam.lookAt(500*Math.sin(p)*Math.cos(t),500*Math.cos(p),500*Math.sin(p)*Math.sin(t));rd.render(sc,cam)})();
}
apply();window.addEventListener('load',()=>{if(cfg.pano)initPano(cfg.pano)});

const F={fName:'name',fHTitle:'heroTitle',fHText:'heroText',fBtn:'btn',fBtnLink:'btnLink',fSvc:'services',fPhone:'phone',fInsta:'insta',fFoot:'footer',fBlue:'blue',fYellow:'yellow'};
function openPanel(){
  for(const k in F)$(k).value=cfg[F[k]]||'';
  $('fNoBanner').checked=false;$('panel').style.display='block';
}
$('lg').onclick=e=>{e.preventDefault();$('lgMsg').textContent='';$('pw').value='';$('login').style.display='flex';$('pw').focus()};
$('lgX').onclick=()=>{$('login').style.display='none'};
$('lgGo').onclick=()=>{if($('pw').value==='0040'){$('login').style.display='none';openPanel()}else $('lgMsg').textContent='Senha incorreta.'};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lgGo').click()};
$('close').onclick=()=>{$('panel').style.display='none'};
$('save').onclick=async()=>{
  const m=$('msg');m.textContent='Salvando…';
  try{
    const assets=await claude.use('assets'),art=await claude.use('artifact');
    if(!art){m.textContent='Sem permissão para salvar. Entre na sua conta do Claude.';return}
    const up=async(id,key)=>{const f=$(id).files[0];if(!f)return;if(!assets){throw new Error('Upload indisponível')}cfg[key]=(await assets.upload(f)).url};
    await up('fLogo','logo');await up('fBanner','banner');await up('fPano','pano');
    if($('fNoBanner').checked)cfg.banner='';
    for(const k in F)cfg[F[k]]=$(k).value;
    cfg.name=cfg.name||'Minha Oficina';
    cfg.phone=cfg.phone.replace(/\D/g,'');
    const json=JSON.stringify(cfg).replace(/</g,'\\u003c');
    const html=SRC.replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/,(x,a,b)=>a+json+b);
    await art.publish(html);
  }catch(e){m.textContent='Erro: '+(e.message||e.code||e)}
};
</script></body></html>
