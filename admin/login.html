<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Administração | Igor Auto Elétrica</title><link rel="stylesheet" href="../styles.css"><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,440px);padding:36px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#17283d,#0b121d);box-shadow:var(--shadow)}.auth-card h1{font:700 2rem Sora;margin:15px 0}.auth-card p{color:var(--muted)}.auth-card form{display:grid;gap:16px}.auth-card input{width:100%;padding:14px;border:1px solid #ffffff2a;border-radius:10px;background:#080f19;color:white}.status{min-height:24px;color:#e8c65b;font-size:.85rem}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="../index.html"><span class="brand-mark">IA</span><span class="brand-copy"><strong>Igor Auto Elétrica</strong><small>Área administrativa</small></span></a><span class="eyebrow" style="margin-top:35px">Acesso restrito</span><h1>Entrar no painel.</h1><p>Utilize a conta administrativa cadastrada no Supabase Auth.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button button-primary" type="submit">Entrar no painel ↗</button><div class="status" id="status" aria-live="polite"></div></form><a class="text-link" href="../index.html">← Voltar ao site</a></section></main><script>
const URL="https://zitqgkmrndmivgkmzuvq.supabase.co",KEY="sb_publishable_PIZUvRRpR8JzfVfFIngvHg_SPDfmZBh";
const client=window.supabase.createClient(URL,KEY);
(async()=>{const {data}=await client.auth.getSession();if(data.session)location.replace("./index.html")})();
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=e.currentTarget.querySelector("button"),status=document.getElementById("status");btn.disabled=true;status.textContent="Verificando acesso…";try{const {error}=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error)throw error;location.replace("./index.html")}catch(err){status.textContent="Não foi possível entrar: "+(err.message||"verifique suas credenciais.")}finally{btn.disabled=false}});
</script></body></html>
